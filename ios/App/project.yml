name: DengueCapture
options:
  bundleIdPrefix: ai.reainmaker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  DengueCaptureCore:
    path: ../DengueCaptureCore
targets:
  DengueCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: DengueCaptureCore
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DengueSense
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Records a short research video of the patient's face and fingertip."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.reainmaker.denguecapture
        TARGETED_DEVICE_FAMILY: "1"
  DengueCaptureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: DengueCapture
  DengueCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: DengueCapture
schemes:
  DengueCapture:
    build:
      targets:
        DengueCapture: all
    test:
      targets:
        - DengueCaptureTests
        - DengueCaptureUITests
