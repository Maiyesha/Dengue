name: DengueCapture
options:
  bundleIdPrefix: ai.reainmaker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  DengueCaptureCore:
    path: ../DengueCaptureCore
targets:
  DengueCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Compile-risk fix 6: the generated Info.plist and the entitlements file are build inputs, never
      # Copy Bundle Resources. The privacy manifest is added explicitly as a resource (I6).
      - path: Sources
        excludes:
          - Info.plist
          - DengueCapture.entitlements
          - PrivacyInfo.xcprivacy
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: DengueCaptureCore
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DengueSense
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Records a short research video of the patient's face and fingertip."
        # I6: LAContext device-owner re-authentication after 10 min idle.
        NSFaceIDUsageDescription: "Unlock DengueSense to continue recording."
        UIBackgroundModes:
          - remote-notification
        # I7: certificate pinning for the API and the identity provider only (NOT the S3 upload host).
        # Hosts and SPKI SHA-256 (base64) pins come from build settings; see ios/App/README.md.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSPinnedDomains:
            $(DS_API_HOST):
              NSIncludesSubdomains: false
              NSPinnedLeafIdentities:
                - SPKI-SHA256-BASE64: $(DS_API_SPKI_SHA256)
                - SPKI-SHA256-BASE64: $(DS_API_SPKI_BACKUP_SHA256)
            $(DS_AUTH_HOST):
              NSIncludesSubdomains: false
              NSPinnedLeafIdentities:
                - SPKI-SHA256-BASE64: $(DS_AUTH_SPKI_SHA256)
                - SPKI-SHA256-BASE64: $(DS_AUTH_SPKI_BACKUP_SHA256)
    entitlements:
      path: Sources/DengueCapture.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.reainmaker.denguecapture
        TARGETED_DEVICE_FAMILY: "1"
        # I7 placeholders: MUST be overridden per environment (xcconfig or CI). The .invalid TLD never resolves.
        DS_API_HOST: api.denguesense.invalid
        DS_AUTH_HOST: auth.denguesense.invalid
        DS_API_SPKI_SHA256: REPLACE_WITH_BASE64_SPKI_SHA256_OF_API_LEAF_KEY
        DS_API_SPKI_BACKUP_SHA256: REPLACE_WITH_BASE64_SPKI_SHA256_OF_API_BACKUP_KEY
        DS_AUTH_SPKI_SHA256: REPLACE_WITH_BASE64_SPKI_SHA256_OF_AUTH_LEAF_KEY
        DS_AUTH_SPKI_BACKUP_SHA256: REPLACE_WITH_BASE64_SPKI_SHA256_OF_AUTH_BACKUP_KEY
  DengueCaptureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: DengueCapture
      # Compile-risk fix 1 (chosen option): the core package is a dependency of the test target with
      # link: false, so `import DengueCaptureCore` resolves its module while the code comes from the host
      # app (one copy of the static library; tests use `@testable import DengueCapture`).
      - package: DengueCaptureCore
        product: DengueCaptureCore
        link: false
  DengueCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: DengueCapture
schemes:
  DengueCapture:
    build:
      targets:
        DengueCapture: all
    test:
      targets:
        - DengueCaptureTests
        - DengueCaptureUITests
